apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astrawatch.fullname" . }}-realtime
  labels:
    app: astrawatch
    component: realtime
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: astrawatch
      component: realtime
  template:
    metadata:
      labels:
        app: astrawatch
        component: realtime
    spec:
      containers:
        - name: realtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8084
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: astrawatch-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: astrawatch-secrets
                  key: INTERNAL_API_TOKEN
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "astrawatch.fullname" . }}-realtime
  labels:
    app: astrawatch
    component: realtime
spec:
  type: {{ .Values.service.type }}
  selector:
    app: astrawatch
    component: realtime
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8084
