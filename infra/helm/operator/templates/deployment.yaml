apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astrawatch.fullname" . }}-operator
  labels:
    app: astrawatch
    component: operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: astrawatch
      component: operator
  template:
    metadata:
      labels:
        app: astrawatch
        component: operator
    spec:
      serviceAccountName: astrawatch-operator
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8081
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: astrawatch-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: astrawatch-secrets
                  key: INTERNAL_API_TOKEN
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: astrawatch-operator
  labels:
    app: astrawatch
    component: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: astrawatch-operator
  labels:
    app: astrawatch
    component: operator
rules:
  - apiGroups: ["astrawatch.io"]
    resources: ["autohealingrules", "autohealingrules/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: astrawatch-operator
  labels:
    app: astrawatch
    component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: astrawatch-operator
subjects:
  - kind: ServiceAccount
    name: astrawatch-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "astrawatch.fullname" . }}-operator
  labels:
    app: astrawatch
    component: operator
spec:
  type: {{ .Values.service.type }}
  selector:
    app: astrawatch
    component: operator
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8081
