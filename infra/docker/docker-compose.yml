services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astrawatch-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astrawatch-net

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: astrawatch
      POSTGRES_USER: astrawatch
      POSTGRES_PASSWORD: astrawatch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrawatch -d astrawatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astrawatch-net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_DB: astrawatch
      CLICKHOUSE_USER: astrawatch
      CLICKHOUSE_PASSWORD: astrawatch
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astrawatch-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astrawatch-net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - astrawatch-net

  # ── Application services (audit V2: compose ran infra only; make dev never
  # started the product). All services share the JWT_SECRET/INTERNAL_API_TOKEN
  # env vars and join the same network. Build contexts are the repo root.



  # ── Observability stack (audit: prometheus.yml + a blank grafana dashboard
  # shipped but nothing ran them — the product advertised Grafana integration
  # with zero panels). Prometheus scrapes the collector and the operator's
  # controller-runtime metrics; Grafana provisions the AstraWatch dashboard.
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    # NOTE: the collector/operator scrape targets are provided by
    # docker-compose.demo.yml (the full app stack). Keeping them out of this
    # base file means `docker compose up` stays infra-only and can never fail on
    # a missing service dependency.
    networks:
      - astrawatch-net

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dashboard.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - astrawatch-net

volumes:
  postgres-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:

networks:
  astrawatch-net:
    driver: bridge
