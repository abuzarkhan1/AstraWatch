services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astrawatch-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astrawatch-net

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: astrawatch
      POSTGRES_USER: astrawatch
      POSTGRES_PASSWORD: astrawatch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrawatch -d astrawatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astrawatch-net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_DB: astrawatch
      CLICKHOUSE_USER: astrawatch
      CLICKHOUSE_PASSWORD: astrawatch
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astrawatch-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astrawatch-net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - astrawatch-net

  # ── Application services (audit V2: compose ran infra only; make dev never
  # started the product). All services share the JWT_SECRET/INTERNAL_API_TOKEN
  # env vars and join the same network. Build contexts are the repo root.

  collector:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.collector
    environment:
      PORT: "8080"
      KAFKA_BROKERS: kafka:29092
      CLICKHOUSE_ADDR: clickhouse:9000
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-internal-dev-token}
      ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - clickhouse
      - redis
    networks:
      - astrawatch-net

  orchestrator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.orchestrator
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-internal-dev-token}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/astrawatch
      SPRING_DATASOURCE_USERNAME: astrawatch
      SPRING_DATASOURCE_PASSWORD: astrawatch
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: "1025"
      ASTRAWATCH_DASHBOARD_URL: http://localhost:5173
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - kafka
      - redis
      - mailhog
    networks:
      - astrawatch-net

  analyzer:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.analyzer
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-internal-dev-token}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - clickhouse
    networks:
      - astrawatch-net

  realtime:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.realtime
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-internal-dev-token}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      ORCHESTRATOR_URL: http://orchestrator:8082
      PORT: "8084"
    ports:
      - "8084:8084"
    depends_on:
      - kafka
      - redis
      - orchestrator
    networks:
      - astrawatch-net

  payment:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.payment
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      PORT: "8085"
    ports:
      - "8085:8085"
    networks:
      - astrawatch-net

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - orchestrator
      - collector
      - realtime
    networks:
      - astrawatch-net

volumes:
  postgres-data:
  clickhouse-data:

networks:
  astrawatch-net:
    driver: bridge
