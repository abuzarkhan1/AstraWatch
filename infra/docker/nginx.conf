server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers (audit V2: none were present) ───────────────────
    # CSP tuned for this SPA: Vite module scripts ('self'), Google Fonts,
    # same-origin API (/api, /v1) + WebSocket (/ws), remote images (Unsplash
    # avatars), dynamic inline styles (React/GSAP set element.style at runtime).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' ws: wss: https://fonts.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── API routing (audit: dev vite proxy and prod nginx must agree) ───
    # Longest-prefix wins in nginx, so these specific routes are matched first.

    # Service Catalog → collector (telemetry-derived, real data).
    location /api/v1/catalog {
        proxy_pass http://collector:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Billing → payment service (Stripe).
    location /api/v1/billing {
        proxy_pass http://payment:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # All other /api/v1/* → orchestrator (auth, incidents, healing, slo, ...).
    location /api/v1 {
        proxy_pass http://orchestrator:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api {
        proxy_pass http://orchestrator:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Analyzer anomaly / predict / root-cause endpoints.
    location /v1/anomaly {
        proxy_pass http://analyzer:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/predict {
        proxy_pass http://analyzer:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Collector metrics query & health.
    location /v1 {
        proxy_pass http://collector:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://realtime:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
