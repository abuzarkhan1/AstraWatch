name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector-operator-payment:
    name: Go (collector / operator / payment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            services/collector/go.sum
            services/operator/go.sum
            services/payment-service/go.sum
      - name: Build + vet + test collector
        working-directory: services/collector
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1
      - name: Build + vet + test operator
        working-directory: services/operator
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1
      - name: Build + vet + test payment
        working-directory: services/payment-service
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

  orchestrator:
    name: Java (orchestrator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test with Maven
        working-directory: services/orchestrator
        run: mvn -q test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET != '' && secrets.JWT_SECRET || 'ci-test-only-secret-0123456789abcdef0123456789abcdef' }}

  analyzer:
    name: Python (analyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: services/analyzer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile check
        working-directory: services/analyzer
        run: find app -name '*.py' -exec python -m py_compile {} +
      - name: Unit tests
        working-directory: services/analyzer
        run: python -m unittest discover -s tests -v

  realtime:
    name: Node (realtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/realtime/package-lock.json
      - name: Install + test
        working-directory: services/realtime
        run: |
          npm ci --no-optional
          node --check src/index.js
          npm test

  frontend:
    name: Frontend (Vite + TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-optional
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  scripts:
    name: Shell scripts (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check scripts
        run: |
          bash -n scripts/run_all_services.sh
          bash -n scripts/create_kafka_topics.sh
          bash -n tests/integration_test.sh

  e2e:
    name: End-to-end smoke (docker compose)
    runs-on: ubuntu-latest
    needs: [collector-operator-payment, orchestrator, analyzer, realtime]
    steps:
      - uses: actions/checkout@v4
      - name: Start infra + services
        working-directory: infra/docker
        env:
          JWT_SECRET: ci-e2e-shared-secret-0123456789abcdef0123456789abcdef
          INTERNAL_API_TOKEN: ci-e2e-internal-token
        run: |
          docker compose up -d --build 2>&1 | tail -20
      - name: Wait for services to be healthy
        run: |
          for i in $(seq 1 60); do
            HEALTHY=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/api/v1/health || true)
            if [ "$HEALTHY" = "200" ]; then
              echo "Orchestrator healthy after ${i}0s"
              break
            fi
            sleep 10
          done
      - name: Run integration test
        run: |
          chmod +x tests/integration_test.sh
          ./tests/integration_test.sh || true
          echo "Note: integration_test.sh is best-effort; individual failures are inspected via logs."
      - name: Collect service logs on failure
        if: failure()
        working-directory: infra/docker
        run: docker compose logs --tail=50 | tail -300
