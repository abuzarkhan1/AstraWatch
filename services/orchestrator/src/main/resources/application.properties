spring.application.name=astrawatch-orchestrator
server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/astrawatch
spring.datasource.username=astrawatch
spring.datasource.password=astrawatch
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=orchestrator-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Autoconfigure Exclusions
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Resilience4j
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s

# Logging
logging.level.com.astrawatch=INFO
logging.level.org.springframework.security=WARN

# Spring Mail & Notification Configuration (MailHog by default on port 1025, or Gmail SMTP via env)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQ:false}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:*}
astrawatch.mail.from=${ASTRAWATCH_MAIL_FROM:noreply@astrawatch.io}
astrawatch.mail.recipient=${ASTRAWATCH_ALERT_RECIPIENT:}
astrawatch.mail.unsubscribe-secret=${ASTRAWATCH_UNSUBSCRIBE_SECRET:}
astrawatch.dashboard.url=${ASTRAWATCH_DASHBOARD_URL:http://localhost:5173}

# Internal service-to-service auth (realtime API-key sync, etc.)
astrawatch.internal-api-token=${INTERNAL_API_TOKEN:}

# Healing & remediation
astrawatch.healing.auto-pr.enabled=${ASTRAWATCH_AUTO_PR_ENABLED:false}
astrawatch.risk.weight.blast-radius=30
astrawatch.risk.weight.reversibility=30
astrawatch.risk.weight.history=25
astrawatch.risk.weight.business-hours=15

# OAuth 2.0 Provider Credentials (Google & GitHub) — MUST be provided via environment, never committed.
astrawatch.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
astrawatch.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
astrawatch.oauth.github.client-id=${GITHUB_CLIENT_ID:}
astrawatch.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}

