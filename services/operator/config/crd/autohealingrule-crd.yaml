apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: autohealingrules.astrawatch.io
spec:
  group: astrawatch.io
  names:
    kind: AutoHealingRule
    listKind: AutoHealingRuleList
    plural: autohealingrules
    singular: autohealingrule
    shortNames:
      - ahr
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - targetService
                - condition
                - action
              properties:
                targetService:
                  type: string
                riskLevel:
                  type: string
                  enum:
                    - LOW
                    - MEDIUM
                    - HIGH
                  default: MEDIUM
                condition:
                  type: object
                  required:
                    - metric
                    - operator
                    - threshold
                  properties:
                    metric:
                      type: string
                    operator:
                      type: string
                      enum:
                        - ">"
                        - "<"
                        - ">="
                        - "<="
                        - "=="
                        - "!="
                    threshold:
                      type: number
                    forDuration:
                      type: string
                action:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum:
                        - RestartPod
                        - RolloutDeployment
                        - ScaleReplica
                    parameters:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                lastTriggered:
                  type: string
                  format: date-time
                triggerCount:
                  type: integer
                  format: int32
                conditions:
                  type: array
                  items:
                    type: object
