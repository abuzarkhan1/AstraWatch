[project]
name = "astrawatch-analyzer"
version = "1.0.0"
requires-python = ">=3.9"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "aiokafka>=0.10.0",
    "clickhouse-driver>=0.2.6",
    "redis>=5.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "prometheus-client>=0.19.0",
    "httpx>=0.26.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "shap>=0.42.0",
    "mlflow>=2.8.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "celery>=5.3.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.0",
    "tensorflow>=2.13.0",
    "pytest>=7.4.0",
]

[project.scripts]
astrawatch-analyzer = "app:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
